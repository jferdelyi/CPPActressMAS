# Tests of CPPActressMAS on macOS, Linux (x86-64 and arm64) and Windows, and builds of the library for iOS and Android
# (tests/README.md). Without the network transports: the runners have neither a broker nor Zenoh, so the network tests
# skip.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS, Apple clang, Debug
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure, build and test
        run: cmake --workflow --preset core

  linux:
    name: Linux ${{ matrix.arch }}, ${{ matrix.compiler }}, ${{ matrix.build_type }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86-64, arm64]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # Every configuration builds with -Wall -Wextra -Wpedantic: a warning of the project fails the build
      - name: Configure
        run: cmake --preset core -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
      - name: Build
        run: cmake --build --preset core
      - name: Test
        run: ctest --preset core -j4

  linux-sanitizers:
    name: Linux, gcc, ${{ matrix.sanitizer }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, tsan]
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # The sanitizers place their shadow memory at fixed addresses, which the 32 bits of mmap randomisation of the
      # runner kernels may take; 28 bits is the usual setting
      - name: Reduce the mmap randomisation
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset ${{ matrix.sanitizer }} -DCAM_TRANSPORT_MQTT=OFF -DCAM_TRANSPORT_ZENOH=OFF
      - name: Build
        run: cmake --build --preset ${{ matrix.sanitizer }}
      - name: Test
        run: ctest --preset ${{ matrix.sanitizer }} -j4

  ios:
    name: iOS arm64, Apple clang, library
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # The library only: the iOS SDK forbids the std::system of the tests (CMakePresets.json)
      - name: Configure and build
        run: cmake --preset ios -DCMAKE_COMPILE_WARNING_AS_ERROR=ON && cmake --build --preset ios

  android:
    name: Android arm64-v8a, NDK clang, libraries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      # The NDK installed on the runner (ANDROID_NDK_HOME); the libraries only, nothing runs
      - name: Configure and build
        run: cmake --preset android -DCMAKE_COMPILE_WARNING_AS_ERROR=ON && cmake --build --preset android

  windows:
    name: Windows, MSVC, Debug
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Configure, build, and run the unit and oracle tests
        shell: pwsh
        run: tests/run.ps1 unit iso
